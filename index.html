<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Conversation App</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app-shell">
<header class="app-header"><div><h1 data-i18n="appTitle">AI Conversation App</h1><p data-i18n="appSubtitle">Run a one-agent conversation or a multi-agent research discussion.</p></div><div class="toolbar"><label for="language-select" data-i18n="languageLabel">Language</label><select id="language-select"><option value="en">English</option><option value="ja">日本語</option></select><button id="theme-toggle" type="button" data-i18n="darkMode">Dark mode</button></div></header>
<section class="panel"><h2 data-i18n="controlsHeading">Conversation controls</h2><form id="debate-form"><div class="field"><label for="topic" data-i18n="topicLabel">Topic, documents, URLs, API notes, calculator/code results, or tool context</label><textarea id="topic" rows="5" maxlength="1000" required placeholder="What should we investigate?"></textarea></div><div class="settings-grid"><div class="field"><label for="rounds" data-i18n="roundsLabel">Maximum rounds</label><input id="rounds" type="number" min="1" max="50" step="1" value="3" required></div></div>
<div class="agent-header"><h3 data-i18n="agentsHeading">Agents</h3><div class="actions"><button id="add-agent" type="button" data-i18n="addAgent">Add agent</button><button id="remove-agent" type="button" data-i18n="removeAgent">Remove agent</button></div></div><p class="help-text" data-i18n="agentHelp">One agent is a normal chat. Two or more agents create a structured multi-agent discussion with a final evaluator.</p><div id="agents-list" class="agents-list"></div><div class="actions"><button id="start-button" type="submit" disabled data-i18n="startButton">Start</button><button id="clear-button" type="button" data-i18n="clearButton">Clear</button></div></form></section>
<section class="panel"><div class="status-row"><h2 data-i18n="transcriptHeading">Transcript</h2><p id="status" role="status" data-i18n="loadingModels">Loading available models...</p></div><p id="error" class="error" role="alert"></p><div id="transcript" class="transcript"></div></section>
</main><script>window.WORKER_URL="https://ai-conversation-app.kanglou-soon.workers.dev";</script><script src="script.js"></script></body></html>
